[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dota2-meta-finder"
version = "0.1.0"
description = "Empirical Dota 2 meta analysis from OpenDota public-match data: tier list, counters, synergy, draft recommendation."
requires-python = ">=3.10"
dependencies = []          # standard library only (urllib, json, sqlite3)

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["metafinder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
