[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dota-rl"
version = "0.1.0"
description = "Dota 2 RL & meta-discovery sandbox (MVP, curriculum F0-F2). Offline research only."
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "tensorboard>=2.14"]

[tool.setuptools.packages.find]
include = ["dota_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
