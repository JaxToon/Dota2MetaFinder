// Wire schema for the Lua <-> Python bridge (spec 3.1 / 12).
// Kept in sync with dota_rl/env/protocol.py. Versioned: a patch that changes
// tensor semantics bumps schema_version.
syntax = "proto3";
package dota_rl;

message Vec2 { float x = 1; float y = 2; }

message AgentState {
  float hp_ratio = 1;
  float mana_ratio = 2;
  float level_norm = 3;
  float gold_norm = 4;
  float xp_norm = 5;
  Vec2 pos_norm = 6;
  float facing = 7;
}

message AbilitySlot {
  bool available = 1;
  float cooldown_ratio = 2;
  bool mana_ok = 3;
  int32 effect_id = 4;
}

message Entity {
  int32 slot = 1;
  bool present = 2;
  bool is_enemy = 3;
  bool is_creep = 4;
  bool visible = 5;
  Vec2 pos_norm = 6;
  float hp_ratio = 7;
  float dist_norm = 8;
  int32 hero_id = 9;
}

message ActionMask {
  repeated bool action_type = 1;
  repeated bool entity = 2;
  repeated bool ability = 3;
  repeated bool item = 4;
  bool coordinate = 5;
}

message Observation {
  string episode_id = 1;
  int64 step_id = 2;
  float sim_time = 3;
  string patch_id = 4;
  int32 schema_version = 5;
  AgentState agent = 6;
  repeated AbilitySlot abilities = 7;
  repeated Entity entities = 8;
  ActionMask masks = 9;
}

message Action {
  int32 action_type = 1;          // STOP=0 MOVE=1 ATTACK=2 CAST=3 ITEM=4
  int32 target_entity_slot = 2;   // -1 if unused
  Vec2 target_xy = 3;
  int32 ability_slot = 4;         // -1 if unused
  int32 item_slot = 5;            // -1 if unused
  int32 schema_version = 6;
}

message StepResult {
  Observation obs = 1;
  float reward = 2;
  bool terminated = 3;
  bool truncated = 4;
}
