experiment:
  name: dota_rl_f2_build
  seed: 42
  patch_id: sandbox_mock_v1
  curriculum_phase: F2
environment:
  num_envs: 24
  max_steps: 500
  obs_schema_version: 1
  action_schema_version: 1
model:
  encoder_dim: 256
  lstm_hidden: 256
ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  epochs: 4
  num_minibatches: 4
  entropy_coef: 0.01
  entropy_coef_final: 0.008
  entropy_anneal: false
  value_coef: 0.5
  max_grad_norm: 0.5
  lr: 0.00015
  target_kl: 0.03
reward:
  normalize: true
  clip: 5.0
  team_blend_tau: 0.0
  terminal_win: 12.0
  enabled:
    eco: true
    xp: true
    com: true
    obj: true
    str: true
    shape: true
    term: true
train:
  device: cpu
  horizon: 128
  iterations: 90
  eval_every: 10
  init_from: runs/dota_rl_f1_baseline/checkpoints/ckpt_000140.pt
  f1_reference_winrate: 0.75
evaluation:
  games_per_opponent: 30
  regression_threshold: 0.05
