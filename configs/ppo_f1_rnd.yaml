# F1 with RND curiosity (spec section 7, stages E3-E4).
# Use this only if entropy-only exploration stalls (spec 7 / 22) -- the intrinsic
# novelty bonus is annealed to 0 over training so it does not fight stability
# once the policy converges.
experiment:
  name: dota_rl_f1_rnd
  seed: 42
  patch_id: sandbox_mock_v1
  curriculum_phase: F1

environment:
  num_envs: 24
  max_steps: 400

model:
  encoder_dim: 256
  lstm_hidden: 256

ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  epochs: 4
  num_minibatches: 4
  entropy_coef: 0.01
  entropy_coef_final: 0.004
  entropy_anneal: true
  value_coef: 0.5
  max_grad_norm: 0.5
  lr: 0.0003
  target_kl: 0.03

exploration:
  rnd_enabled: true
  rnd_coef: 0.4          # intrinsic weight at the start (E3)
  rnd_coef_final: 0.0    # annealed to zero by end of training (E4)
  rnd_lr: 0.0001

reward:
  normalize: true
  clip: 5.0
  terminal_win: 10.0
  enabled: {eco: true, xp: true, com: true, obj: true, str: true, shape: true, term: true}

train:
  device: cpu
  horizon: 128
  iterations: 100
  eval_every: 20

evaluation:
  games_per_opponent: 24
  regression_threshold: 0.05
