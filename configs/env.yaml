# Environment contract defaults (spec 4, 12). Tensor dims are fixed in
# dota_rl/env/protocol.py; a patch that changes tensor semantics must bump
# obs_schema_version / action_schema_version here and there.
environment:
  backend: mock            # mock | dota_sandbox (dota_sandbox is a stub until api_probe passes)
  num_envs: 16
  max_steps: 400
  obs_schema_version: 1
  action_schema_version: 1
  patch_id: sandbox_mock_v1
